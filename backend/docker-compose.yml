services:
  api:
    build: .
    container_name: tripscript-backend-api
    env_file:
      - path: .env
        required: true
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./storage:/app/storage
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  ocr:
    build: ./ocr_service
    container_name: tripscript-ocr
    profiles:
      - ocr
    environment:
      LIGHTONOCR_MODEL_ID: lightonai/LightOnOCR-1B-1025
      LIGHTONOCR_MAX_NEW_TOKENS: "768"
      LIGHTONOCR_PROMPT: Extract only visible receipt text lines in natural reading order. Preserve item rows, dates, totals, currencies, and prices. Do not invent hidden card numbers or repeated filler digits.
      HF_HOME: /models/huggingface
    ports:
      - "127.0.0.1:8010:8010"
    volumes:
      - hf-models:/models/huggingface
    gpus: all
    restart: unless-stopped

  redis:
    image: redis:7
    container_name: tripscript-redis
    ports:
      - "127.0.0.1:6379:6379"

volumes:
  hf-models:
