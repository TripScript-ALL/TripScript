services:
  api:
    depends_on:
      - ollama

  ollama:
    image: ollama/ollama:latest
    container_name: tripscript-ollama
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama:/root/.ollama
    environment:
      OLLAMA_KEEP_ALIVE: 2m
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_FLASH_ATTENTION: "1"
    gpus: all
    restart: unless-stopped

volumes:
  ollama:
